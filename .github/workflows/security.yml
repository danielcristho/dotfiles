name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch newly leaked patterns and upstream changes
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ZIZMOR_VERSION: 1.30.1

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/

      - name: Scan full git history
        run: gitleaks git --redact --no-banner -v .

  sources:
    name: Audit package sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check download sources and remote scripts
        run: scripts/audit-sources

      - name: List package installs added in this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/audit-sources --diff "origin/${BASE_REF}"

      - name: Check allowlisted sources are still reachable
        run: |
          status=0
          while read -r url; do
            case "$url" in ''|\#*) continue ;; esac
            # Prefixes ending in / are directories, only check full URLs
            [[ "$url" == */ ]] && continue
            if ! curl -fsSL -o /dev/null --retry 2 "$url"; then
              echo "::warning::Allowlisted source unreachable: $url"
              status=1
            fi
          done < .github/security/allowed-sources.txt
          [ "$status" -eq 0 ] || echo "Some sources are unreachable, check if they moved or were taken over"

  workflows:
    name: Audit GitHub workflows (zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: |
          pipx run "zizmor==${ZIZMOR_VERSION}" --offline --format=github .github/workflows
