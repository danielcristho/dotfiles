name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive"
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/

      - name: Find shell scripts
        run: |
          git ls-files | while read -r f; do
            if [[ "$f" == *.sh ]] || head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then
              echo "$f"
            fi
          done > shell-files.txt
          cat shell-files.txt

      - name: Syntax check
        run: xargs -a shell-files.txt -n1 bash -n

      - name: ShellCheck
        run: xargs -a shell-files.txt shellcheck -S warning

  test:
    name: Test installer (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - name: Install test dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CLI flags
        shell: bash
        run: |
          ./install --help
          scripts/install-packages --list
          if scripts/install-packages not-a-group; then
            echo "unknown package group should fail"; exit 1
          fi
          if ./install --not-a-flag; then
            echo "unknown flag should fail"; exit 1
          fi

      - name: Link dotfiles into a clean HOME
        shell: bash
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          export HOME="$(mktemp -d)"
          ./install -y --no-packages --no-sync | tee install.log

          grep -q "Dotfiles Installation for Ubuntu ${UBUNTU_VERSION}" install.log
          grep -q "Installation complete" install.log

          for link in .zshrc .vimrc .config/nvim .config/starship.toml \
                      .config/zellij/config.kdl .config/lazygit/config.yml \
                      .config/yazi/yazi.toml .local/bin/git-lazypush; do
            if [ ! -L "$HOME/$link" ] || [ ! -e "$HOME/$link" ]; then
              echo "missing or broken symlink: $link"; exit 1
            fi
          done

          # No dangling symlinks anywhere
          if find "$HOME" -xtype l | grep .; then
            echo "dangling symlinks found"; exit 1
          fi

      - name: Existing files are backed up
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          echo "old" > "$HOME/.zshrc"
          ./install -y --no-packages --no-sync
          backup=$(find "$HOME" -maxdepth 1 -name '.dotfiles-backup-*' | head -1)
          [ -n "$backup" ] && grep -q old "$backup/.zshrc"

      - name: Commit message hook
        shell: bash
        run: |
          msg=$(mktemp)
          echo "feat(install): add tui" > "$msg" && .githooks/commit-msg "$msg"
          echo "update stuff" > "$msg"
          if .githooks/commit-msg "$msg"; then
            echo "bad commit message should be rejected"; exit 1
          fi
